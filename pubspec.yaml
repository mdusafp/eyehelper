name: eyehelper
description: Eye exercise reminder and training app.
publish_to: none
version: 1.0.5+9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  auto_size_text: ^3.0.0
  card_swiper: ^3.0.1
  firebase_analytics: ^12.4.3
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  fl_chart: ^1.2.0
  # Vendored copy: upstream is abandoned and uses APIs removed from Flutter 3.x.
  flare_flutter:
    path: packages/flare_flutter
  flutter:
    sdk: flutter

  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_time_picker_spinner: ^2.0.0
  flutter_timezone: ^5.1.0
  in_app_review: ^2.0.12
  liquid_glass_widgets: ^0.21.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  timezone: ^0.10.1
  tuple: ^2.0.2
  url_launcher: ^6.3.2
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path_android: "assets/app_icons/ic_launcher.png"
  image_path_ios: "assets/app_icons/ic_launcher.png"
  android: true # can specify file name here e.g. "ic_launcher"
  ios: true # can specify file name here e.g. "My-Launcher-Icon"
  adaptive_icon_background: "assets/app_icons/ic_background.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/app_icons/ic_foreground.png" # only available for Android 8.0 devices and above

flutter:
  assets:
    - assets/

  fonts:
    - family: FiraSans
      fonts:
        - asset: assets/fira_sans_regular.ttf
          weight: 500
        - asset: assets/fira_sans_light.ttf
          weight: 200
  uses-material-design: true
