<title>Eye Helper Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&family=Fira+Sans+Condensed:wght@700;800;900&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #07110c;
    --ink: #e7f2ec;
    --muted: #8aa596;
    --green: #509f75;
    --line: rgba(207, 233, 219, 0.14);
    --chip: rgba(207, 233, 219, 0.08);
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Fira Sans", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-inline: 16px;
    padding-block: 16px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .stage {
    position: relative;
    height: min(calc(100% - 64px), calc((100vw - 32px) * 16 / 9));
    aspect-ratio: 9 / 16;
    max-width: 100%;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--line);
    background: #fff;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .big-play {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(7, 17, 12, 0.18); border: 0; cursor: pointer; padding: 0;
  }
  .big-play span {
    width: 92px; height: 92px; border-radius: 50%;
    background: var(--green); display: grid; place-items: center;
    box-shadow: 0 12px 44px rgba(80, 159, 117, 0.55);
    transition: transform 0.2s ease;
  }
  .big-play:hover span, .big-play:focus-visible span { transform: scale(1.07); }
  .big-play:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
  .bar {
    display: flex; align-items: center; gap: 10px;
    width: min(100%, 560px);
    font-variant-numeric: tabular-nums;
  }
  .ctl {
    height: 36px; min-width: 36px; padding: 0 12px; border-radius: 18px;
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    font: 600 13px/1 "Fira Sans", system-ui, sans-serif; letter-spacing: 0.04em;
    cursor: pointer; display: grid; place-items: center;
  }
  .ctl:hover { background: rgba(207, 233, 219, 0.16); }
  .ctl:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  #seek { flex: 1; min-width: 0; accent-color: var(--green); }
  #time { color: var(--muted); font-size: 13px; width: 78px; text-align: right; }
  @media (prefers-reduced-motion: reduce) { .big-play span { transition: none; } }
</style>

<div class="stage" id="stage">
  <canvas id="cv" width="1080" height="1920" aria-label="Eye Helper promo video"></canvas>
  <button class="big-play" id="bigPlay" aria-label="Play with sound">
    <span><svg width="34" height="38" viewBox="0 0 34 38" aria-hidden="true"><path d="M4 3 L31 19 L4 35 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg></span>
  </button>
</div>
<div class="bar">
  <button class="ctl" id="playBtn" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" max="45" step="0.01" value="0" aria-label="Seek">
  <span id="time">0:00 / 0:45</span>
  <button class="ctl" id="langBtn" aria-label="Switch language">RU</button>
</div>

<script>
(() => {
const W = 1080, H = 1920, DUR = 45;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const C = {
  green: '#509f75', greenD: '#2f7a55', mint: '#CFE9DB', ink: '#42210b', red: '#c1272d',
  grey: '#88949C', text: '#1b2520', muted: '#5f7167', paper: '#f3f8f5', night: '#0a1210',
};
const FONT = '"Fira Sans", system-ui, -apple-system, sans-serif';
const COND = '"Fira Sans Condensed", "Fira Sans", system-ui, sans-serif';

const STR = {
  ru: {
    s1a: 'Ты перед экраном', s1b: 'каждый день.', s1c: ['Глаза тоже', '*устают*.'],

      { t: 'Горизонтальные движения', d: 'Поводите глазами слева направо и наоборот.', c: ['Смотрите влево', 'Смотрите вправо'] },
      { t: 'Зажмуривания', d: 'Крепко зажмурьтесь, затем расслабьте глаза.', c: ['Зажмурьте глаза', 'Расслабьте глаза'] },
      { t: 'Моргание', d: 'Быстро поморгайте.', c: ['Быстро моргайте', 'Быстро моргайте'] },
      { t: 'Фокусировка', d: 'Сначала на ближнем предмете, потом на дальнем.', c: ['Смотрите на телефон', 'Смотрите вдаль'] },
      { t: 'Пальминг', d: 'Потрите руки до тепла и приложите к глазам.', c: ['Разогрейте руки', 'Приложите руки к глазам'] },
    ],
    repOf: (a, b) => `${a} из ${b}`,
    remHead: ['Напоминания', 'в рабочие часы'],
    days: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
    date: 'Среда, 23 сентября', now: 'сейчас', nTitle: 'Напоминание', nBody: 'Пора делать зарядку!',
    statHead: ['Прогресс', 'видно каждый день'],
    streak: 'Серия', daysRow: 'дней подряд', best: 'Лучшая — 21 день',
    week: 'Эта неделя', minEyes: 'мин для глаз', month: 'Сентябрь',
    out: ['Твоим глазам', 'нужен *отдых*.'], tag: 'Зарядка для глаз', store: 'Скачать в App Store', free: 'Бесплатно',
  },
  en: {
    s1a: "You're staring at a screen", s1b: 'every single day.', s1c: ['Your eyes get', '*tired* too.'],
    brand: 'Eye *Helper*', brandSub: 'Workouts for your eyes', brandChip: '5 minutes a day',
    exHead: ['6 exercises', "we'll show you how"],
    ex: [
      { t: 'Vertical movements', d: 'Move your eyes up and down and back.', c: ['Look up', 'Look down'] },
      { t: 'Horizontal movements', d: 'Move your eyes left and right and back.', c: ['Look left', 'Look right'] },
      { t: 'Eye squeezing', d: 'Squeeze your eyes shut, then relax them.', c: ['Squeeze your eyes', 'Relax your eyes'] },
      { t: 'Blinking', d: 'Blink quickly.', c: ['Blink quickly', 'Blink quickly'] },
      { t: 'Focusing', d: 'Focus on a near object, then on a far one.', c: ['Look at your phone', 'Look into the distance'] },
      { t: 'Palming', d: 'Warm up your hands and place them over your eyes.', c: ['Warm up your hands', 'Hands over your eyes'] },
    ],
    repOf: (a, b) => `${a} of ${b}`,
    remHead: ['Reminders', 'during your work hours'],
    days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
    date: 'Wednesday, September 23', now: 'now', nTitle: 'Reminder', nBody: 'Time to do your eye exercises!',
    statHead: ['Progress', 'you can see every day'],
    streak: 'Streak', daysRow: 'days in a row', best: 'Best — 21 days',
    week: 'This week', minEyes: 'min for your eyes', month: 'September',
    out: ['Give your eyes', 'the *rest* they need.'], tag: 'Workouts for your eyes', store: 'Download on the App Store', free: 'Free',
  },
};
let S = STR.ru;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * TAU / 3) + 1),
};
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function font(w, s, fam = FONT) { ctx.font = `${w} ${s}px ${fam}`; }
function text(s, x, y, o = {}) {
  font(o.weight || 400, o.size || 40, o.fam || FONT);
  ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.fillStyle = o.color || C.text;
  ctx.fillText(s, x, y);
  ctx.letterSpacing = '0px';
}
function measure(s, w, size, fam = FONT, ls = 0) { font(w, size, fam); ctx.letterSpacing = ls + 'px'; const m = ctx.measureText(s).width; ctx.letterSpacing = '0px'; return m; }
function wrap(s, maxW) {
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
  }
  if (line) out.push(line);
  return out;
}

// Kinetic line: words rise out of a mask one by one; *word* takes the accent colour.
function kline(s, x, y, t, t0, o = {}) {
  const size = o.size || 96, weight = o.weight || 800, fam = o.fam || FONT;
  const col = o.color || C.text, acc = o.acc || C.green, align = o.align || 'left';
  const stag = o.stag ?? 0.07, dur = o.dur ?? 0.6, out = o.out, lh = size * 1.3;
  font(weight, size, fam);
  ctx.letterSpacing = (o.ls || 0) + 'px';
  const toks = s.split(' ').map(w => ({ acc: w.includes('*'), w: w.replace(/\*/g, '') }));
  const sp = ctx.measureText(' ').width;
  const ws = toks.map(k => ctx.measureText(k.w).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (toks.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  toks.forEach((k, i) => {
    const a0 = t0 + i * stag;
    const p = E.out(seg(t, a0, a0 + dur));
    let dy = (1 - p) * lh;
    let gone = false;
    if (out != null) {
      const b0 = out + i * 0.04;
      dy -= E.in(seg(t, b0, b0 + 0.4)) * lh;
      gone = t >= b0 + 0.4;
    }
    if (p > 0 && !gone) {
      ctx.save();
      ctx.beginPath(); ctx.rect(cx - 40, y - size * 1.02, ws[i] + 80, size * 1.34); ctx.clip();
      const gl = o.glitch ? o.glitch(i) : 0;
      if (gl) {
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#ff2d55'; ctx.fillText(k.w, cx + gl, y + dy);
        ctx.fillStyle = '#00e5ff'; ctx.fillText(k.w, cx - gl, y + dy);
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = k.acc ? acc : col;
      ctx.fillText(k.w, cx, y + dy);
      ctx.restore();
    }
    cx += ws[i] + sp;
  });
  ctx.letterSpacing = '0px';
}

// ---------- the mascot ----------
// Face units: eye centres at (±u, 0), mouth around y = 1.05u.
function face(cx, cy, u, o = {}) {
  const ink = o.ink || C.ink;
  const glasses = !!o.glasses;
  const r = (glasses ? 0.34 : 0.42) * u * (o.irisScale || 1);
  const look = o.look || [0, 0];
  const rx = glasses ? 0.32 * u : 0.16 * u, ry = glasses ? 0.13 * u : 0.12 * u;
  ctx.save();
  ctx.translate(cx, cy);
  if (o.rot) ctx.rotate(o.rot);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  if (o.blush > 0) {
    ctx.globalAlpha = o.blush * 0.9; ctx.fillStyle = C.red;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 1.2 * u, 0.62 * u, 0.2 * u, 0.075 * u, 0, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  for (const s of [-1, 1]) {
    const ex = s * u, ey = 0;
    const conv = o.converge ? -s * o.converge * rx : 0;
    const px = ex + look[0] * rx + conv, py = ey + look[1] * ry;
    const mode = o.eyes || 'normal';
    const blink = s === 1 && o.wink != null ? Math.max(o.wink, o.blink || 0) : (o.blink || 0);
    if (mode === 'normal' || mode === 'tired') iris(px, py, r, blink, mode === 'tired' ? (o.lid || 0) : 0, u, ink);
    else if (mode === 'spiral') spiral(ex, ey, r * 1.05, u, o.spin || 0, ink);
    else if (mode === 'squeeze') {
      const j = o.jit || 0;
      ctx.strokeStyle = ink; ctx.lineWidth = 0.1 * u;
      ctx.beginPath();
      ctx.moveTo(ex + s * 0.45 * r + j, ey - 0.55 * r);
      ctx.lineTo(ex - s * 0.5 * r + j, ey);
      ctx.lineTo(ex + s * 0.45 * r + j, ey + 0.55 * r);
      ctx.stroke();
    } else if (mode === 'closed') closedEye(ex, ey, r, u, ink);

    if (o.brows !== false && !glasses) {
      ctx.strokeStyle = ink; ctx.lineWidth = 0.045 * u;
      const lift = o.browLift || 0;
      ctx.beginPath();
      if (s < 0) ctx.arc(ex, ey - lift * u, 1.32 * r, Math.PI * 1.03, Math.PI * 1.61);
      else ctx.arc(ex, ey - lift * u, 1.32 * r, Math.PI * 1.39, Math.PI * 1.97);
      ctx.stroke();
    }
  }

  if (glasses) {
    ctx.strokeStyle = ink; ctx.lineWidth = 0.09 * u;
    for (const s of [-1, 1]) { rr(s * u - 0.72 * u, -0.5 * u, 1.44 * u, 1.0 * u, 0.2 * u); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-0.28 * u, -0.08 * u); ctx.lineTo(0.28 * u, -0.08 * u); ctx.stroke();
  }

  mouth(o.mouth || 'smile', u, ink, o.open ?? 1, glasses ? 0.92 : 1.05, o.jit || 0);

  if (o.sweat > 0) {
    ctx.globalAlpha = o.sweat;
    ctx.fillStyle = '#7fbfff';
    const x = 1.62 * u, y = -0.55 * u + (1 - o.sweat) * 0.2 * u;
    ctx.beginPath(); ctx.moveTo(x, y - 0.24 * u);
    ctx.quadraticCurveTo(x + 0.14 * u, y, x, y + 0.08 * u);
    ctx.quadraticCurveTo(x - 0.14 * u, y, x, y - 0.24 * u); ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (o.hands) {
    const { p, rub } = o.hands;
    for (const s of [-1, 1]) {
      const x0 = s * 0.46 * u, y0 = 2.45 * u + s * rub * 0.16 * u, r0 = -s * 0.12;
      const x1 = s * 0.98 * u, y1 = 0.12 * u, r1 = -s * 0.36;
      const x = lerp(x0, x1, p), y = lerp(y0, y1, p) - Math.sin(p * Math.PI) * 0.35 * u;
      hand(x, y, 0.98 * u, lerp(r0, r1, p), s, ink, 0.065 * u / (0.98 * u));
    }
    if (p < 0.2 && o.heat > 0) {
      ctx.strokeStyle = C.red; ctx.lineWidth = 0.05 * u; ctx.globalAlpha = o.heat * (1 - p * 5);
      for (let k = -1; k <= 1; k++) {
        const x = k * 0.55 * u, y = 1.05 * u - Math.abs(k) * 0.1 * u;
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.bezierCurveTo(x + 0.12 * u, y - 0.12 * u, x - 0.12 * u, y - 0.24 * u, x, y - 0.36 * u); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function iris(px, py, r, blink, lid, u, ink) {
  if (blink > 0.86) { closedEye(px, py, r, u, ink); return; }
  const ry = r * (1 - blink * 0.95), k = ry / r;
  ctx.save();
  const lidY = py - r + lid * 1.3 * r;
  if (lid > 0) { ctx.beginPath(); ctx.rect(px - r * 2, lidY, r * 4, r * 3); ctx.clip(); }
  ctx.fillStyle = ink; ctx.beginPath(); ctx.ellipse(px, py, r, ry, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(px + 0.36 * r, py - 0.46 * r * k, 0.27 * r, 0.27 * r * k, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px + 0.6 * r, py - 0.08 * r * k, 0.1 * r, 0.1 * r * k, 0, 0, TAU); ctx.fill();
  ctx.restore();
  if (lid > 0) {
    ctx.strokeStyle = ink; ctx.lineWidth = 0.07 * u;
    ctx.beginPath(); ctx.moveTo(px - r * 1.12, lidY + 0.06 * r);
    ctx.quadraticCurveTo(px, lidY - 0.1 * r, px + r * 1.12, lidY + 0.06 * r); ctx.stroke();
  }
}
function closedEye(x, y, r, u, ink) {
  ctx.strokeStyle = ink; ctx.lineWidth = 0.085 * u;
  ctx.beginPath(); ctx.arc(x, y - 0.3 * r, 0.62 * r, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
}
function spiral(x, y, r, u, spin, ink) {
  ctx.fillStyle = ink; circ(x, y, r); ctx.fill();
  ctx.fillStyle = '#fff'; circ(x, y, r * 0.8); ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = 0.034 * u;
  const n = 5;
  for (let k = 0; k < n; k++) {
    const v = (((k - spin * n) % n) + n) % n / n;
    const rad = r * (0.14 + 0.56 * v);
    ctx.globalAlpha = clamp(v * 6);
    circ(x, y, rad); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function mouth(type, u, ink, open, my, jit) {
  const y = my * u;
  ctx.save(); ctx.translate(jit, 0);
  ctx.strokeStyle = ink; ctx.fillStyle = ink;
  if (type === 'flat') {
    ctx.lineWidth = 0.075 * u; ctx.beginPath(); ctx.moveTo(-0.2 * u, y); ctx.lineTo(0.2 * u, y); ctx.stroke();
  } else if (type === 'wavy') {
    ctx.lineWidth = 0.065 * u; ctx.beginPath();
    for (let i = 0; i <= 24; i++) { const f = i / 24; const x = lerp(-0.26, 0.26, f) * u; const yy = y + Math.sin(f * TAU * 2) * 0.045 * u; i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }
    ctx.stroke();
  } else if (type === 'o') {
    const rr0 = 0.13 * u * open;
    circ(0, y + 0.05 * u, rr0); ctx.fill();
    ctx.save(); circ(0, y + 0.05 * u, rr0); ctx.clip();
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.ellipse(0, y + 0.05 * u + rr0 * 0.75, rr0 * 0.8, rr0 * 0.55, 0, 0, TAU); ctx.fill();
    ctx.restore();
  } else {
    const big = type === 'big';
    const w = (big ? 0.4 : 0.22) * u, d = (big ? 0.62 : 0.28) * u * open, tb = (big ? 0.07 : 0.045) * u;
    const path = () => {
      ctx.beginPath(); ctx.moveTo(-w, y - tb);
      ctx.bezierCurveTo(-w * 0.45, y + tb * 0.4, -w * 0.25, y + tb, 0, y + tb * 0.4);
      ctx.bezierCurveTo(w * 0.25, y + tb, w * 0.45, y + tb * 0.4, w, y - tb);
      ctx.bezierCurveTo(w * 1.08, y + d * 0.8, w * 0.55, y + d, 0, y + d);
      ctx.bezierCurveTo(-w * 0.55, y + d, -w * 1.08, y + d * 0.8, -w, y - tb);
      ctx.closePath();
    };
    path(); ctx.fill();
    ctx.save(); path(); ctx.clip();
    if (big) {
      ctx.fillStyle = '#fff';
      for (const f of [-0.7, -0.24, 0.24, 0.7]) { ctx.beginPath(); ctx.ellipse(f * w, y + 0.07 * u, 0.075 * u, 0.1 * u, 0, 0, TAU); ctx.fill(); }
    } else {
      ctx.fillStyle = C.red; ctx.beginPath(); ctx.ellipse(0, y + d * 0.9, w * 0.8, d * 0.5, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}
// Mitten-style hand, fingers up; drawn as an outlined union.
function hand(x, y, sc, rot, s, ink, lw) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  const th = -s;
  const fingers = [[-0.36, -1.02], [-0.12, -1.14], [0.12, -1.1], [0.36, -0.95]];
  const shapes = (extra) => {
    ctx.lineCap = 'round';
    for (const [fx, fy] of fingers) { ctx.lineWidth = 0.22 + extra; ctx.beginPath(); ctx.moveTo(fx, -0.1); ctx.lineTo(fx, fy); ctx.stroke(); }
    ctx.lineWidth = 0.24 + extra; ctx.beginPath(); ctx.moveTo(th * 0.3, 0.3); ctx.lineTo(th * 0.78, -0.18); ctx.stroke();
    rr(-0.5 - extra / 2, -0.35 - extra / 2, 1.0 + extra, 0.95 + extra, 0.4 + extra / 2); ctx.fill();
  };
  ctx.strokeStyle = ink; ctx.fillStyle = ink; shapes(lw * 2);
  ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; shapes(0);

// ======================= player =======================
const fontsReady = (async () => {
  const loads = [];
  for (const w of [300, 400, 500, 600, 700, 800]) loads.push(document.fonts.load(`${w} 40px "Fira Sans"`, 'EyeЖж09'));
  for (const w of [700, 800, 900]) loads.push(document.fonts.load(`${w} 40px "Fira Sans Condensed"`, 'EyeЖж09'));
  try { await Promise.all(loads); await document.fonts.ready; } catch (e) { /* fall back to system fonts */ }
})();
let audioBuf = null;
const audioReady = buildAudio().then(b => (audioBuf = b));

window.renderFrame = t => render(t);
window.setLang = l => { S = STR[l] || STR.ru; };
window.exportWav = async () => wavBase64(await audioReady);
window.whenReady = () => Promise.all([fontsReady, audioReady]).then(() => true);

const bigPlay = document.getElementById('bigPlay');
const playBtn = document.getElementById('playBtn');
const seek = document.getElementById('seek');
const timeEl = document.getElementById('time');
const langBtn = document.getElementById('langBtn');
let actx = null, src = null, playing = false, startAt = 0, offset = 0;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const now = () => (playing ? actx.currentTime - startAt : offset);

async function play() {
  await audioReady;
  if (!actx) actx = new AudioContext();
  await actx.resume();
  if (offset >= DUR - 0.05) offset = 0;
  src = actx.createBufferSource(); src.buffer = audioBuf; src.connect(actx.destination);
  startAt = actx.currentTime - offset; src.start(0, offset);
  playing = true; bigPlay.hidden = true; playBtn.textContent = '❚❚'; playBtn.setAttribute('aria-label', 'Pause');
}
function pause() {
  if (!playing) return;
  offset = now(); try { src.stop(); } catch (e) {}
  playing = false; playBtn.textContent = '▶'; playBtn.setAttribute('aria-label', 'Play');
}
bigPlay.addEventListener('click', play);
playBtn.addEventListener('click', () => (playing ? pause() : play()));
seek.addEventListener('input', () => { const was = playing; pause(); offset = +seek.value; bigPlay.hidden = true; if (was) play(); else render(offset); });
langBtn.addEventListener('click', () => { const l = langBtn.textContent === 'RU' ? 'en' : 'ru'; setLang(l); langBtn.textContent = l.toUpperCase(); if (!playing) render(offset); });
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); } });

function loop() {
  let t = now();
  if (playing && t >= DUR) { pause(); offset = DUR; t = DUR; bigPlay.hidden = false; }
  if (playing) render(t);
  seek.value = t; timeEl.textContent = `${fmt(Math.min(t, DUR))} / ${fmt(DUR)}`;
  requestAnimationFrame(loop);
}
fontsReady.then(() => { render(7.9); requestAnimationFrame(loop); });
})();
